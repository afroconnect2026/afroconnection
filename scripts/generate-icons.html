<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfroConnect Icon Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #001F3F;
            color: white;
        }
        h1 { color: #FFC300; }
        .canvas-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .icon-item {
            text-align: center;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }
        canvas {
            border: 2px solid #008000;
            margin: 10px auto;
            display: block;
            border-radius: 8px;
        }
        button {
            background: #FFC300;
            color: #001F3F;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 10px;
        }
        button:hover {
            background: #ffcc26;
        }
        .instructions {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>🌍 AfroConnect Icon Generator</h1>

    <div class="instructions">
        <h3>Instructions:</h3>
        <ol>
            <li>Open this file in Chrome/Edge browser</li>
            <li>Right-click each icon below and "Save image as..."</li>
            <li>Save to: <code>C:/Users/Admin/afroconnect/public/icons/</code></li>
            <li>Use the exact filename shown below each icon</li>
        </ol>
    </div>

    <div class="canvas-container" id="icons"></div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const container = document.getElementById('icons');

        sizes.forEach(size => {
            // Create canvas
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Draw background circle (green)
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#008000');
            gradient.addColorStop(1, '#2ca42c');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            // Draw handshake icon (simplified)
            const centerX = size / 2;
            const centerY = size / 2;
            const iconSize = size * 0.5;

            ctx.fillStyle = '#FFC300';
            ctx.strokeStyle = '#FFC300';
            ctx.lineWidth = size * 0.08;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Draw simplified handshake (two hands meeting)
            ctx.beginPath();
            // Left hand
            ctx.moveTo(centerX - iconSize * 0.4, centerY);
            ctx.lineTo(centerX - iconSize * 0.1, centerY - iconSize * 0.2);
            ctx.lineTo(centerX - iconSize * 0.1, centerY + iconSize * 0.2);
            ctx.closePath();
            ctx.fill();

            // Right hand
            ctx.beginPath();
            ctx.moveTo(centerX + iconSize * 0.4, centerY);
            ctx.lineTo(centerX + iconSize * 0.1, centerY - iconSize * 0.2);
            ctx.lineTo(centerX + iconSize * 0.1, centerY + iconSize * 0.2);
            ctx.closePath();
            ctx.fill();

            // Draw "AC" text overlay
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.35}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('AC', centerX, centerY);

            // Create container
            const item = document.createElement('div');
            item.className = 'icon-item';

            const title = document.createElement('h4');
            title.textContent = `${size}x${size}`;

            const filename = document.createElement('p');
            filename.textContent = `icon-${size}x${size}.png`;
            filename.style.fontSize = '12px';
            filename.style.color = '#FFC300';

            const downloadBtn = document.createElement('button');
            downloadBtn.textContent = 'Download';
            downloadBtn.onclick = () => {
                const link = document.createElement('a');
                link.download = `icon-${size}x${size}.png`;
                link.href = canvas.toDataURL();
                link.click();
            };

            item.appendChild(title);
            item.appendChild(canvas);
            item.appendChild(filename);
            item.appendChild(downloadBtn);
            container.appendChild(item);
        });
    </script>
</body>
</html>
